<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Le port de plaisance de Russell" />
    <meta name="author" content="Russell" />
    <title>Port de Plaisance de Russell</title>
    <link href="/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div id="navbar">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./dashboard.html">Tableau de bord</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./catways.html">Catways</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./reservations.html">Réservations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./users.html">Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./api-docs.html">Documentation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html" id="logout">Se déconnecter</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <div id="reservations-list-card">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Numéro du catway</th>
                    <th scope="col">Nom du client</th>
                    <th scope="col">Nom du bateau amarré</th>
                    <th scope="col">Début de la réservation</th>
                    <th scope="col">Fin de la réservation</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <div id="reservation-create-card">
        <form id="createReservationForm">
            <div class="mb-3">
                <label for="catwayNumber" class="form-label">Numéro du catway</label>
                <input type="number" class="form-control" id="catwayNumber" aria-describedby="catwayNumberHelp">
            </div>

            <div class="mb-3">
                <label for="clientName" class="form-label">Nom du client</label>
                <input type="text" class="form-control" id="clientName" aria-describedby="clientNameHelp">
            </div>

            <div class="mb-3">
                <label for="boatName" class="form-label">Nom du bateau amarré</label>
                <input type="text" class="form-control" id="boatName" aria-describedby="boatNameHelp">
            </div>

            <div class="mb-3">
                <label for="startDate" class="form-label">Début de la réservation</label>
                <input type="date" class="form-control" id="startDate" aria-describedby="startDateHelp">
            </div>

            <div class="mb-3">
                <label for="endDate" class="form-label">Fin de la réservation</label>
                <input type="date" class="form-control" id="endDate" aria-describedby="endDateHelp">
            </div>

            <button type="submit" class="btn btn-primary">Créer</button>
        </form>
    </div>


    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascripts/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = getToken();
            if (!token) {
                window.location.href = '/index.html';
                return;
            }

            fetch('/catways', {
                headers: {
                    'Authorization': token
                }
            })
                .then(response => response.json())
                .then(catways => {
                    const tbody = document.querySelector('#reservations-list-card tbody');
                    catways.forEach(catway => {
                        fetch(`/catways/${catway.catwayNumber}/reservations`, {
                            headers: {
                                'Authorization': token
                            }
                        })
                            .then(response => response.json())
                            .then(reservations => {
                                reservations.forEach(reservation => {
                                    const row = `<tr>
                                <td>${reservation.catwayNumber}</td>
                                <td>${reservation.clientName}</td>
                                <td>${reservation.boatName}</td>
                                <td>${new Date(reservation.startDate).toLocaleDateString('fr-FR')}</td>
                                <td>${new Date(reservation.endDate).toLocaleDateString('fr-FR')}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="updateReservation(${catway.catwayNumber}, '${reservation._id}')">Modifier</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteReservation(${catway.catwayNumber}, '${reservation._id}')">Supprimer</button>
                                </td>
                            </tr>`;
                                    tbody.innerHTML += row;
                                });
                            });
                    });
                })
                .catch(error => console.error('Erreur:', error));

            document.getElementById('logout').addEventListener('click', function (e) {
                e.preventDefault();
                removeToken();
                window.location.href = '/index.html';
            });

            document.getElementById('createReservationForm').addEventListener('submit', function (e) {
                e.preventDefault();
                createReservation();
            });
        });

        function createReservation() {
            const catwayNumber = document.getElementById('catwayNumber').value;
            const clientName = document.getElementById('clientName').value;
            const boatName = document.getElementById('boatName').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            const token = getToken();
            fetch(`/catways/${catwayNumber}/reservations`, {
                method: 'POST',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ catwayNumber, clientName, boatName, startDate, endDate })
            })
                .then(response => {
                    if (response.ok) {
                        alert('Réservation créée avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la création');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }

        function updateReservation(catwayNumber, reservationId) {
            const clientName = prompt('Nom du client :');
            const boatName = prompt('Nom du bateau :');
            const startDate = prompt('Date de début (YYYY-MM-DD) :');
            const endDate = prompt('Date de fin (YYYY-MM-DD) :');

            const token = getToken();
            fetch(`/catways/${catwayNumber}/reservations/${reservationId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ clientName, boatName, startDate, endDate })
            })
                .then(response => {
                    if (response.ok) {
                        alert('Réservation modifiée avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la modification');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }

        function deleteReservation(catwayNumber, reservationId) {
            if (!confirm('Confirmer la suppression ?')) return;
            const token = getToken();
            fetch(`/catways/${catwayNumber}/reservations/${reservationId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': token
                }
            })
                .then(response => {
                    if (response.ok) {
                        alert('Réservation supprimée avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la suppression');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }
    </script>
</body>

</html>
