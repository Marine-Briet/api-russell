<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Le port de plaisance de Russell" />
    <meta name="author" content="Russell" />
    <title>Port de Plaisance de Russell</title>
    <link href="/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div id="navbar">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./dashboard.html">Tableau de bord</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./catways.html">Catways</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./reservations.html">Réservations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./users.html">Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./api-docs.html">Documentation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html" id="logout">Se déconnecter</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <div id="catways-list-card">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Numéro du catway</th>
                    <th scope="col">Type du catway</th>
                    <th scope="col">Etat du catway</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <div id="catway-create-card">
        <form id="createCatwayForm">
            <div class="mb-3">
                <label for="number" class="form-label">Numéro du catway</label>
                <input type="number" class="form-control" id="number" aria-describedby="numberHelp">
            </div>

            <div class="mb-3">
                <label for="catwayType" class="form-label">Type de catway</label>
                <select class="form-select" id="catwayType">
                    <option value="long">Long</option>
                    <option value="short">Short</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="text" class="form-label">Etat du catway</label>
                <input type="text" class="form-control" id="state" aria-describedby="stateHelp">
            </div>

            <button type="submit" class="btn btn-primary">Créer</button>
        </form>
    </div>


    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascripts/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = getToken();
            if (!token) {
                window.location.href = '/index.html';
                return;
            }

            fetch('/catways', {
                headers: {
                    'Authorization': token
                }
            })
                .then(response => response.json())
                .then(catways => {
                    const tbody = document.querySelector('#catways-list-card tbody');
                    catways.forEach(catway => {
                        const row = `<tr>
                        <td>${catway.catwayNumber}</td>
                        <td>${catway.catwayType}</td>
                        <td>${catway.catwayState}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="updateCatway(${catway.catwayNumber})">Modifier</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCatway(${catway.catwayNumber})">Supprimer</button>
                        </td>
                    </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Erreur:', error));

            document.getElementById('logout').addEventListener('click', function (e) {
                e.preventDefault();
                removeToken();
                window.location.href = '/index.html';
            });

            document.getElementById('createCatwayForm').addEventListener('submit', function (e) {
                e.preventDefault();
                createCatway();
            });
        });


        function createCatway() {
            const number = document.getElementById('number').value;
            const catwayType = document.getElementById('catwayType').value;
            const state = document.getElementById('state').value;

            const token = getToken();
            fetch('/catways', {
                method: 'POST',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ catwayNumber: number, catwayType, catwayState: state })
            })
                .then(response => {
                    if (response.ok) {
                        alert('Catway créé avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la création');
                    }
                })
                .catch(error => console.error('Erreur:', error));

        }

        function updateCatway(catwayNumber) {
            const newState = prompt('Nouvel état du catway :');
            if (!newState) return;

            const token = getToken();
            fetch(`/catways/${catwayNumber}`, {
                method: 'PUT',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ catwayState: newState })
            })
                .then(response => {
                    if (response.ok) {
                        alert('Catway modifié avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la modification');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }



        function deleteCatway(catwayNumber) {
            if (!confirm('Confirmer la suppression ?')) return;
            const token = getToken();
            fetch(`/catways/${catwayNumber}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': token
                }
            })
                .then(response => {
                    if (response.ok) {
                        alert('Catway supprimé avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la suppression');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }
    </script>
</body>

</html>
