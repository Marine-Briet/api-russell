<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Le port de plaisance de Russell" />
  <meta name="author" content="Russell" />
  <title>Port de Plaisance de Russell</title>
  <link href="/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
  <div id="navbar">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./dashboard.html">Tableau de bord</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./catways.html">Catways</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./reservations.html">Réservations</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./users.html">Users</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./api-docs.html">Documentation</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./index.html" id="logout">Se déconnecter</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>

  <div id="user-card">
    <div class="card">
      <div class="card-body">
        <p id="username"></p>
        <p id="email"></p>
      </div>
    </div>
  </div>

  <div id="date-card">
    <div class="card">
      <div class="card-body">
        Date du jour : <span id="date"></span>
      </div>
    </div>
  </div>

  <div id="reservations-card">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Numéro du catway</th>
          <th scope="col">Nom du client</th>
          <th scope="col">Nom du Bateau</th>
          <th scope="col">Date de debut</th>
          <th scope="col">Date de fin</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/javascripts/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const today = new Date();
      const formattedDate = today.toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('date').textContent = formattedDate;

      const token = getToken();
      if (!token) {
        window.location.href = '/index.html';
        return;
      }

      const payload = JSON.parse(atob(token.split('.')[1]));
      document.getElementById('username').textContent = `Nom d'utilisateur : ${payload.user.username}`;
      document.getElementById('email').textContent = `Email : ${payload.user.email}`;

      fetch('/catways', {
        headers: {
          'Authorization': token
        }
      })
        .then(response => response.json())
        .then(catways => {
          const tbody = document.querySelector('#reservations-card tbody');

          catways.forEach(catway => {
            fetch(`/catways/${catway.catwayNumber}/reservations`, {
              headers: {
                'Authorization': token
              }
            })
              .then(response => response.json())
              .then(reservations => {
                reservations.forEach(reservation => {
                  const row = `<tr>
                                <td>${reservation.catwayNumber}</td>
                                <td>${reservation.clientName}</td>
                                <td>${reservation.boatName}</td>
                                <td>${new Date(reservation.startDate).toLocaleDateString('fr-FR')}</td>
                                <td>${new Date(reservation.endDate).toLocaleDateString('fr-FR')}</td>
                            </tr>`;
                  tbody.innerHTML += row;
                });
              });
          });
        })
        .catch(error => {
          console.error('Erreur:', error);
        });

      document.getElementById('logout').addEventListener('click', function (e) {
        e.preventDefault();
        removeToken();
        window.location.href = '/index.html';
      });
    });
  </script>
</body>

</html>
