<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Le port de plaisance de Russell" />
    <meta name="author" content="Russell" />
    <title>Port de Plaisance de Russell</title>
    <link href="/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div id="navbar">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav w-100">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./dashboard.html">Tableau de bord</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./catways.html">Catways</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./reservations.html">Réservations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./users.html">Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./api-docs.html">Documentation</a>
                        </li>
                        <li class="nav-item ms-auto">
                            <a class="nav-link" href="./index.html" id="logout">Se déconnecter</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <div class="container-fluid mt-3">
        <div class="row g-3">

            <!-- Tableau à gauche -->
            <div class="col-lg-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold">Liste des utilisateurs</div>
                    <div class="card-body p-0">
                        <div id="users-list-card" class="table-responsive">
                            <table class="table table-bordered table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Nom d'utilisateur</th>
                                        <th>Email</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulaire à droite -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold">Créer un nouvel utilisateur</div>
                    <div class="card-body" id="users-create-card">
                        <form id="createUsersForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Nom d'utilisateur</label>
                                <input type="text" class="form-control" id="username">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" id="password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Créer</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascripts/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = getToken();
            if (!token) {
                window.location.href = '/index.html';
                return;
            }

            fetch('/users', {
                headers: {
                    'Authorization': token
                }
            })
                .then(response => response.json())
                .then(users => {
                    const tbody = document.querySelector('#users-list-card tbody');
                    users.forEach(users => {
                        const row = `<tr>
                        <td>${users.username}</td>
                        <td>${users.email}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="updateUsers('${users.username}','${users.email}')">Modifier</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteUsers('${users.email}')">Supprimer</button>
                        </td>
                    </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Erreur:', error));

            document.getElementById('logout').addEventListener('click', function (e) {
                e.preventDefault();
                removeToken();
                window.location.href = '/index.html';
            });

            document.getElementById('createUsersForm').addEventListener('submit', function (e) {
                e.preventDefault();
                createUsers();
            });
        });


        function createUsers() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const token = getToken();
            fetch('/users', {
                method: 'POST',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            })
                .then(response => {
                    if (response.ok) {
                        alert('Utilisateur créé avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la création');
                    }
                })
                .catch(error => console.error('Erreur:', error));

        }

        function updateUsers(username, userEmail) {
            const newUsername = prompt('Nouveau nom d\'utilisateur :', username);
            const newEmail = prompt('Nouvel email :', userEmail);
            const newPassword = prompt('Nouveau mot de passe (laisser vide pour ne pas changer) :');

            if (!newUsername && !newEmail && !newPassword) return;

            const data = { username: newUsername, email: newEmail };
            if (newPassword) {
                data.password = newPassword;
            }

            const token = getToken();
            fetch(`/users/${userEmail}`, {
                method: 'PUT',
                headers: {
                    'Authorization': token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        alert('Utilisateur modifié avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la modification');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }


        function deleteUsers(userEmail) {
            if (!confirm('Confirmer la suppression ?')) return;
            const token = getToken();
            fetch(`/users/${userEmail}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': token
                }
            })
                .then(response => {
                    if (response.ok) {
                        alert('Utilisateur supprimé avec succès');
                        location.reload();
                    } else {
                        alert('Erreur lors de la suppression');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }
    </script>
</body>

</html>
